notes:
  - הקמפיין נפרד מקמפיין חנוכה של קרקס בראבו – לא לערבב תאריכים, מחירים או ערים משם.
  - בטיחות היא חלק מהמסר: מתקנים מתנפחים, נחיתות רכות, צוות מפעילים – בלי להבטיח "אפס סיכון".
  - לא נותנים קודי הנחה. מי ששואל על הנחה – להטבות כרטיסי האשראי בעמוד בקופת תל אביב.
  - ימי זיכרון (יום השואה, יום הזיכרון) – בלי פוסטים חגיגיים ובלי פרסום ממומן.
  - לא להשתמש בטענה "הגדול בישראל" בלי אישור (טענות דומות קיימות אצל פארקים אחרים). "פארק האקסטרים של ישראל" – בסדר.
