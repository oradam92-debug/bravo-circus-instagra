# תדריך הקמפיין – הוואי פארק באושילנד כפר סבא
# זה ה"ידע" של סוכן השיווק. הוא בונה את התוכנית רק לפי מה שכתוב כאן.
# כל מה שמסומן [להשלים] – הסוכן לא ימציא, אלא יכתוב אותו כ"שאלה פתוחה" בתוכנית.
# אחרי עדכון – מריצים שוב: Actions ← "סוכן שיווק – תוכנית קמפיין" ← Run workflow.

campaign: hawaii-park
name: הוואי פארק
operator: בראבו (א.א בראבו גרופ בע"מ) – הבית של קרקס בראבו
location:
  venue: אושילנד כפר סבא
  city: כפר סבא
  address: "[להשלים – לאמת כתובת מדויקת במתחם אושילנד]"
  parking: "[להשלים]"
  indoor_outdoor: "[להשלים – מקורה / פתוח / משולב]"

season:
  start: 2027-02-15      # אמצע פברואר
  end: 2027-06-11        # חג שבועות (ערב חג 10.6)
  teaser_start: 2027-02-01   # שבועיים של טיזר לפני הפתיחה

product:
  description: >
    פארק חווייתי משפחתי בעיצוב הוואי טרופי: אווירת חוף, פרחי היביסקוס, גלים ודקלים,
    בתוך מתחם אושילנד בכפר סבא, בהפקת בראבו.
  attractions: "[להשלים – רשימת המתקנים / האזורים / המופעים בפארק]"
  shows: "[להשלים – האם יש מופע במה (למשל מופע לואו / אמני קרקס בראבו), כמה פעמים ביום]"
  opening_hours: "[להשלים]"
  ticket_price: "[להשלים]"
  ticket_link: "[להשלים]"
  ages: "מומלץ לגילאי 2–12 [לאמת]"
  capacity: "[להשלים – כמה מבקרים בו זמנית]"
  food: "[להשלים – דוכנים / שייקים / אסור להכניס אוכל?]"
  birthdays_groups: "[להשלים – ימי הולדת, גנים ובתי ספר, טלפון להזמנות קבוצתיות]"

audiences_hint:
  - הורים לילדים 2–12 מכפר סבא, רעננה, הוד השרון, הרצליה, ראש העין, צור יגאל, כוכב יאיר
  - האוכלוסייה הערבית במשולש הדרומי (טייבה, טירה, קלנסווה) – תוכן גם בערבית
  - גנים, צהרונים ובתי ספר (טיולים וסיורים בבוקר באמצע השבוע)
  - חוגגי ימי הולדת
  - סבים וסבתות בחופשות

budget: "[להשלים – תקציב מדיה כולל לעונה]"
goals: "[להשלים – יעד מבקרים / כרטיסים לעונה]"

# הנחיות קבועות לסוכן (אפשר לשנות)
notes:
  - הקמפיין נפרד מקמפיין חנוכה של קרקס בראבו – לא לערבב תאריכים, מחירים או ערים משם.
  - ייצוג תרבות הוואי בכבוד – בלי קריקטורות של פסלי טיקי/אלים ובלי לבוש חושפני; לואו = מסיבה, פרחים, גלים, צבע.
  - ימי זיכרון (יום השואה, יום הזיכרון) – בלי פוסטים חגיגיים ובלי פרסום ממומן.
