name: voiceover
on:
  workflow_dispatch:
    inputs:
      text: {description: "טקסט לקריינות", required: true}
      name: {description: "שם קובץ", required: true, default: "voice"}
permissions: {contents: write}
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TEXT: ${{ inputs.text }}
          NAME: ${{ inputs.name }}
        run: |
          mkdir -p media/voice
          for v in ash onyx coral; do
            jq -n --arg t "$TEXT" --arg v "$v" '{model:"gpt-4o-mini-tts",voice:$v,input:$t,response_format:"mp3",
              instructions:"Native Israeli Hebrew. Energetic, warm, festive circus-commercial announcer for families. Clear, excited, short pauses between phrases."}' > req.json
            curl -sf https://api.openai.com/v1/audio/speech -H "Authorization: Bearer $OPENAI_API_KEY" -H "Content-Type: application/json" -d @req.json -o "media/voice/${NAME}-${v}.mp3"
          done
          ls -l media/voice
      - name: commit
        run: |
          git config user.name "bravo-agent"; git config user.email "bravo-agent@users.noreply.github.com"
          git add media/voice; git commit -m "voiceover ${{ inputs.name }}"; git pull --rebase -q; git push
