name: תכנון פוסטים (כולל תמונות AI)
on:
  schedule:
    - cron: "37 4 * * *"   # כל יום ~06:37 – משלים פוסטים ל-3 הימים הקרובים
  workflow_dispatch:
    inputs:
      days:
        description: "כמה ימים לתכנן"
        default: "3"
      brief:
        description: "הנחיות לשבוע (לא חובה)"
        default: ""
permissions:
  contents: write
  issues: write
concurrency:
  group: bravo-agent-state
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID || '17841453120285016' }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ vars.FB_PAGE_ID || '320386741480987' }}
      GRAPH_HOST: ${{ vars.GRAPH_HOST || 'graph.facebook.com' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      IMAGE_MODEL: ${{ vars.IMAGE_MODEL || 'gpt-image-2' }}
      USE_AI_IMAGES: ${{ vars.USE_AI_IMAGES || 'false' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
      ENABLE_DMS: ${{ vars.ENABLE_DMS || 'false' }}
      AUTO_APPROVE: ${{ vars.AUTO_APPROVE || 'true' }}
      WEEKLY_BRIEF: ${{ inputs.brief || vars.WEEKLY_BRIEF }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5-5' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m agent.main plan --days ${{ inputs.days || 3 }}
      - name: Save state
        run: |
          git config user.name "bravo-agent"
          git config user.email "bravo-agent@users.noreply.github.com"
          git add content state media
          git diff --cached --quiet && exit 0
          git commit -m "agent: content plan"
          git pull --rebase
          git push
