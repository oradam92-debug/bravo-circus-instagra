name: חידוש טוקן אינסטגרם
on:
  schedule:
    - cron: "23 4 1,15 * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$IG_USER_ID" ] || [ -z "$IG_ACCESS_TOKEN" ]; then
            echo "::warning::IG_USER_ID / IG_ACCESS_TOKEN secrets are not configured; skipping token refresh."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.check.outputs.ok == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.check.outputs.ok == 'true'
        run: pip install -r requirements.txt
      - id: r
        if: steps.check.outputs.ok == 'true'
        run: python -m agent.main refresh
      - name: Save new token as secret (needs GH_PAT secret)
        if: ${{ steps.check.outputs.ok == 'true' && env.GH_PAT != '' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" --body "${{ steps.r.outputs.token }}"
