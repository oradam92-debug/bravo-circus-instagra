name: פרסום פוסט יומי
on:
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: bravo-agent-state
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
      ENABLE_DMS: ${{ vars.ENABLE_DMS || 'false' }}
      AUTO_APPROVE: ${{ vars.AUTO_APPROVE || 'true' }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5-5' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m agent.main publish
      - name: Save state
        run: |
          git config user.name "bravo-agent"
          git config user.email "bravo-agent@users.noreply.github.com"
          git add content state
          git diff --cached --quiet && exit 0
          git commit -m "agent: published post"
          git pull --rebase
          git push
