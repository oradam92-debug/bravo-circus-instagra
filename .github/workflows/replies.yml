name: מענה לתגובות והודעות
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: bravo-agent-state
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID || '17841453120285016' }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ vars.FB_PAGE_ID || '320386741480987' }}
      GRAPH_HOST: ${{ vars.GRAPH_HOST || 'graph.facebook.com' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
      ENABLE_DMS: ${{ vars.ENABLE_DMS || 'false' }}
      AUTO_APPROVE: ${{ vars.AUTO_APPROVE || 'true' }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5-5' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m agent.main reply
      - name: Save state
        run: |
          git config user.name "bravo-agent"
          git config user.email "bravo-agent@users.noreply.github.com"
          git add content state
          git diff --cached --quiet && exit 0
          git commit -m "agent: replies state"
          git pull --rebase
          git push
