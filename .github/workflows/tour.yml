name: פוסט יומי – מחר אנחנו מגיעים ל... (כולל עדכון מקופת תל אביב)
on:
  schedule:
    - cron: "17 4 * * *"   # כל יום ב-06:17 (שעון ישראל בחורף) – מכין את הפוסט של היום
  workflow_dispatch:
    inputs:
      days:
        description: "כמה ימים קדימה לבדוק בלוח ההופעות"
        default: "2"
permissions:
  contents: write
  issues: write
concurrency:
  group: bravo-agent-state
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      IMAGE_MODEL: ${{ vars.IMAGE_MODEL || 'gpt-image-2' }}
      USE_AI_IMAGES: ${{ vars.USE_AI_IMAGES || 'false' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
      AUTO_APPROVE: ${{ vars.AUTO_APPROVE || 'true' }}
      TOUR_POST_TIME: ${{ vars.TOUR_POST_TIME }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5-5' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Hebrew font for posters
        run: sudo apt-get install -y -qq fonts-noto-core >/dev/null || true
      - run: pip install -r requirements.txt
      - name: Update show schedule from Kupat Tel Aviv
        continue-on-error: true   # if Kupat is down, keep yesterday's schedule
        run: |
          python -m playwright install --with-deps chromium >/dev/null
          python -m agent.main sync
      - run: python -m agent.main tour --days ${{ inputs.days || 2 }}
      - name: Save state
        run: |
          git config user.name "bravo-agent"
          git config user.email "bravo-agent@users.noreply.github.com"
          git add content state media/tour
          git diff --cached --quiet && exit 0
          git commit -m "agent: tour post (מחר אנחנו מגיעים)"
          git pull --rebase
          git push
