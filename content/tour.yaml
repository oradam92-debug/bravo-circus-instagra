# לוח ההופעות של קרקס בראבו – ממנו הסוכן מעלה כל יום פוסט "מחר אנחנו מגיעים ל..."
# הפוסט עולה יום לפני כל הופעה, בשעה post_time, עם פוסטר שנוצר אוטומטית + קישור לקופת תל אביב.
#
# לכל הופעה:
#   date:   תאריך ההופעה (YYYY-MM-DD)
#   time:   שעה ("16:00"). כמה הופעות באותה עיר ובאותו יום = כמה שורות; יאוחדו לפוסט אחד.
#   city:   עיר
#   venue:  אולם
#   link:   קישור המכירה בקופת תל אביב לעיר הזו (אם אין – default_link)
#   poster: (לא חובה) שם קובץ פוסטר מוכן מתיקיית media/ במקום פוסטר אוטומטי
#   note:   (לא חובה) משהו מיוחד שהסוכן יזכיר בפוסט

post_time: "10:00"
default_link: https://www.kupat.co.il/Bravo_Circus
